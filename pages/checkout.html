<!DOCTYPE html>
<html lang="en">
<head>
<style id="fouc-guard">html{opacity:0!important}</style><script>(function(){var t=localStorage.getItem('omegatek-theme');if(!t)t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');function show(){var s=document.getElementById("fouc-guard");if(s){document.documentElement.style.transition="opacity 0.25s ease";s.parentNode.removeChild(s);}}if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){requestAnimationFrame(function(){requestAnimationFrame(show);});});}else{show();}})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Omegatek Solutions</title>
    <meta name="description" content="Complete your purchase securely at Omegatek Solutions">
    <meta name="robots" content="noindex, nofollow">

<script src="https://cdn.tailwindcss.com"></script>
     <script src="../js/tailwind-checkout-config.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../images2/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/revival.css">

    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        [data-theme="dark"] body {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0826 100%);
        }

        [data-theme="dark"] .checkout-card {
            background: rgba(28, 28, 35, 0.92);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        [data-theme="dark"] .order-summary {
            background: rgba(38, 38, 48, 0.8);
        }

        [data-theme="dark"] .form-input {
            background: rgba(28, 28, 35, 0.9);
            border-color: rgba(255, 255, 255, 0.12);
            color: #f5f5f7;
        }

        [data-theme="dark"] .payment-method {
            border-color: rgba(255, 255, 255, 0.12);
            color: #f5f5f7;
        }
        
        .checkout-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }
        
        .checkout-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .form-input {
            width: 100%;
            padding: 1.2rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1.5rem;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #b30ce6;
            box-shadow: 0 0 0 4px rgba(179, 12, 230, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #b30ce6, #9333ea);
            color: white;
            padding: 1.5rem 3rem;
            border: none;
            border-radius: 12px;
            font-size: 1.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(179, 12, 230, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .order-summary {
            background: #f9fafb;
            padding: 2rem;
            border-radius: 16px;
        }
        
        .cart-item {
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem 0;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .payment-method {
            padding: 1.5rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .payment-method:hover {
            border-color: #b30ce6;
            background: rgba(179, 12, 230, 0.05);
        }
        
        .payment-method.selected {
            border-color: #b30ce6;
            background: rgba(179, 12, 230, 0.1);
        }
        
        .payment-method input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #b30ce6;
        }
        
        @media (max-width: 768px) {
            .checkout-container {
                padding: 2rem 1rem;
            }
            
            .checkout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    
    <div class="checkout-container">
        
        <div class="text-center mb-8">
            <a href="products.html" class="inline-flex items-center gap-2 text-primary hover:text-purple-600 transition-colors mb-4">
                <i class="fas fa-arrow-left"></i> Back to Products
            </a>
            <h1 class="text-5xl font-bold text-gray-800 mb-2">Checkout</h1>
            <p class="text-xl text-gray-600">Complete your order securely</p>
        </div>

<div class="checkout-card">
            <div class="grid md:grid-cols-3 gap-8 p-8">

<div class="md:col-span-2">
                    <form id="checkoutForm">

<div class="mb-8">
                            <h2 class="text-3xl font-bold text-gray-800 mb-6">Contact Information</h2>
                            
                            <div class="grid md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-gray-700 mb-2 font-semibold">Full Name *</label>
                                    <input type="text" name="fullName" class="form-input" required placeholder="John Doe">
                                </div>
                                <div>
                                    <label class="block text-gray-700 mb-2 font-semibold">Email Address *</label>
                                    <input type="email" name="email" class="form-input" required placeholder="john@example.com">
                                </div>
                                <div>
                                    <label class="block text-gray-700 mb-2 font-semibold">Phone Number *</label>
                                    <input type="tel" name="phone" class="form-input" required placeholder="073 123 4567">
                                </div>
                                <div>
                                    <label class="block text-gray-700 mb-2 font-semibold">Alternative Phone</label>
                                    <input type="tel" name="altPhone" class="form-input" placeholder="Optional">
                                </div>
                            </div>
                        </div>

<div class="mb-8">
                            <h2 class="text-3xl font-bold text-gray-800 mb-6">Delivery Address</h2>
                            
                            <div class="mb-4">
                                <label class="block text-gray-700 mb-2 font-semibold">Street Address *</label>
                                <input type="text" name="address" class="form-input" required placeholder="123 Main Street">
                            </div>
                            
                            <div class="grid md:grid-cols-3 gap-4 mb-4">
                                <div>
                                    <label class="block text-gray-700 mb-2 font-semibold">Suburb/Area *</label>
                                    <input type="text" name="suburb" class="form-input" required placeholder="Midrand">
                                </div>
                                <div>
                                    <label class="block text-gray-700 mb-2 font-semibold">City *</label>
                                    <input type="text" name="city" class="form-input" required placeholder="Johannesburg">
                                </div>
                                <div>
                                    <label class="block text-gray-700 mb-2 font-semibold">Province *</label>
                                    <select name="province" class="form-input" required>
                                        <option value="">Select Province</option>
                                        <option value="Gauteng">Gauteng</option>
                                        <option value="Western Cape">Western Cape</option>
                                        <option value="Eastern Cape">Eastern Cape</option>
                                        <option value="KwaZulu-Natal">KwaZulu-Natal</option>
                                        <option value="Free State">Free State</option>
                                        <option value="Limpopo">Limpopo</option>
                                        <option value="Mpumalanga">Mpumalanga</option>
                                        <option value="North West">North West</option>
                                        <option value="Northern Cape">Northern Cape</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-gray-700 mb-2 font-semibold">Postal Code *</label>
                                <input type="text" name="postalCode" class="form-input" required placeholder="1685">
                            </div>
                        </div>

<div class="mb-8">
                            <h2 class="text-3xl font-bold text-gray-800 mb-6">Payment Method</h2>
                            
                            <div class="space-y-4">
                                <label class="payment-method selected">
                                    <div class="flex items-center gap-4">
                                        <input type="radio" name="paymentMethod" value="bank_transfer" checked>
                                        <div class="flex-1">
                                            <div class="flex items-center gap-2 mb-1">
                                                <i class="fas fa-university text-2xl text-primary"></i>
                                                <span class="text-xl font-semibold">Bank Transfer / EFT</span>
                                            </div>
                                            <p class="text-gray-600 ml-10">Pay via direct bank transfer (Banking details provided after order)</p>
                                        </div>
                                    </div>
                                </label>
                                
                                <label class="payment-method">
                                    <div class="flex items-center gap-4">
                                        <input type="radio" name="paymentMethod" value="cash_on_delivery">
                                        <div class="flex-1">
                                            <div class="flex items-center gap-2 mb-1">
                                                <i class="fas fa-money-bill-wave text-2xl text-primary"></i>
                                                <span class="text-xl font-semibold">Cash on Delivery</span>
                                            </div>
                                            <p class="text-gray-600 ml-10">Pay with cash upon delivery (Midrand area only)</p>
                                        </div>
                                    </div>
                                </label>
                                
                                <label class="payment-method">
                                    <div class="flex items-center gap-4">
                                        <input type="radio" name="paymentMethod" value="payfast">
                                        <div class="flex-1">
                                            <div class="flex items-center gap-2 mb-1">
                                                <i class="fas fa-credit-card text-2xl text-primary"></i>
                                                <span class="text-xl font-semibold">Card Payment (PayFast)</span>
                                            </div>
                                            <p class="text-gray-600 ml-10">Secure payment with credit/debit card</p>
                                        </div>
                                    </div>
                                </label>
                            </div>
                        </div>

<div class="mb-8">
                            <h2 class="text-3xl font-bold text-gray-800 mb-6">Order Notes (Optional)</h2>
                            <textarea name="notes" class="form-input" rows="4" placeholder="Any special instructions for your order?"></textarea>
                        </div>

<div class="mb-6">
                            <label class="flex items-start gap-3 text-gray-700">
                                <input type="checkbox" name="terms" required class="mt-1 w-5 h-5">
                                <span class="text-base">I agree to the <a href="terms-of-service.html" class="text-primary hover:underline">Terms of Service</a> and <a href="privacy-policy.html" class="text-primary hover:underline">Privacy Policy</a></span>
                            </label>
                        </div>
                        
                        <button type="submit" class="btn-primary" id="placeOrderBtn">
                            <i class="fas fa-lock mr-2"></i> Place Order Securely
                        </button>
                    </form>
                </div>

<div class="md:col-span-1">
                    <div class="order-summary sticky top-8">
                        <h2 class="text-3xl font-bold text-gray-800 mb-6">Order Summary</h2>
                        
                        <div id="checkoutCartItems" class="mb-6">
                            
                        </div>
                        
                        <div class="border-t-2 border-gray-300 pt-4 space-y-3">
                            <div class="flex justify-between text-lg">
                                <span class="text-gray-600">Subtotal:</span>
                                <span class="font-semibold" id="subtotalAmount">R0.00</span>
                            </div>
                            <div class="flex justify-between text-lg">
                                <span class="text-gray-600">Delivery Fee:</span>
                                <span class="font-semibold" id="deliveryFee">R0.00</span>
                            </div>
                            <div class="flex justify-between text-2xl font-bold text-primary border-t-2 border-primary pt-4">
                                <span>Total:</span>
                                <span id="totalAmount">R0.00</span>
                            </div>
                        </div>
                        
                        <div class="mt-6 p-4 bg-green-50 border-2 border-green-200 rounded-lg">
                            <div class="flex items-start gap-2">
                                <i class="fas fa-shield-alt text-green-600 text-xl mt-1"></i>
                                <div>
                                    <h3 class="font-semibold text-green-800">Secure Checkout</h3>
                                    <p class="text-sm text-green-700">Your information is protected</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4 text-center text-sm text-gray-500">
                            <i class="fas fa-truck mr-2"></i> Free delivery on orders over R500
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
    
    <script type="module" src="../js/pages/checkout.js"></script>
    <script src="../js/transitions.js" defer></script>
    <script src="../js/theme-toggle.js" defer></script>
</body>
</html>
