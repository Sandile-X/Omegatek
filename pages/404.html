<style id="fouc-guard">html{opacity:0!important}</style><script>(function(){var t=localStorage.getItem('omegatek-theme');if(!t)t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');function show(){var s=document.getElementById("fouc-guard");if(s){document.documentElement.style.transition="opacity 0.25s ease";s.parentNode.removeChild(s);}}if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){requestAnimationFrame(function(){requestAnimationFrame(show);});});}else{show();}})();</script>

    <style>
        .error-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .error-content {
            background: white;
            padding: 4rem 3rem;
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: #b30ce6;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .error-title {
            font-size: 3rem;
            color: #334;
            margin-bottom: 1.5rem;
        }
        
        .error-message {
            font-size: 1.6rem;
            color: #777;
            margin-bottom: 3rem;
            line-height: 1.6;
        }
        
        .error-actions {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .error-btn {
            display: inline-block;
            padding: 1.2rem 2.5rem;
            font-size: 1.6rem;
            text-decoration: none;
            border-radius: 5rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .btn-primary {
            background: #b30ce6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #9a0bb8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(179, 12, 230, 0.4);
        }
        
        .btn-secondary {
            background: transparent;
            color: #b30ce6;
            border: 2px solid #b30ce6;
        }
        
        .btn-secondary:hover {
            background: #b30ce6;
            color: white;
            transform: translateY(-2px);
        }
        
        .error-icon {
            font-size: 4rem;
            color: #b30ce6;
            margin-bottom: 2rem;
            opacity: 0.7;
        }
        
        @media (max-width: 768px) {
            .error-content {
                padding: 3rem 2rem;
            }
            
            .error-code {
                font-size: 6rem;
            }
            
            .error-title {
                font-size: 2.5rem;
            }
            
            .error-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .error-btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            
            <div class="error-code">404</div>
            
            <h1 class="error-title">Page Not Found</h1>
            
            <p class="error-message">
                Oops! The page you're looking for seems to have disappeared. 
                Don't worry, our electronics repair experts can fix broken devices, 
                but this broken link needs a different kind of help!
            </p>
            
            <div class="error-actions">
                <a href="/" class="error-btn btn-primary">
                    <i class="fas fa-home"></i> Back to Homepage
                </a>
                <a href="services.html" class="error-btn btn-secondary">
                    <i class="fas fa-tools"></i> Our Services
                </a>
            </div>
        </div>
    </div>

<script>
        
        let countdown = 30;
        const countdownElement = document.createElement('p');
        countdownElement.style.marginTop = '2rem';
        countdownElement.style.fontSize = '1.4rem';
        countdownElement.style.color = '#777';
        document.querySelector('.error-content').appendChild(countdownElement);
        
        const updateCountdown = () => {
            countdownElement.textContent = `Redirecting to homepage in ${countdown} seconds...`;
            countdown--;
            
            if (countdown < 0) {
                window.location.href = 'index.html';
            }
        };
        
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>

       AOS.init({
          duration: 1000,
          once: true,
          offset: 100
       });
    </script>
<script src="../js/theme-toggle.js" defer></script>
</body>
