<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Omegatek Solutions</title>
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com;">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="../images2/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-wrap { text-align: center; margin-bottom: 2rem; }
        .logo-wrap img {
            width: 72px; height: 72px;
            border-radius: 16px;
            border: 2px solid rgba(179, 12, 230, 0.4);
            padding: 4px;
            background: rgba(179, 12, 230, 0.1);
        }
        .logo-wrap h1 {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0.75rem 0 0.25rem;
        }
        .logo-wrap p { color: rgba(255,255,255,0.5); font-size: 0.85rem; }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: rgba(179, 12, 230, 0.6);
            box-shadow: 0 0 0 3px rgba(179, 12, 230, 0.15);
        }
        input::placeholder { color: rgba(255,255,255,0.25); }

        .pw-wrap { position: relative; }
        .toggle-pw {
            position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: rgba(255,255,255,0.4);
            cursor: pointer; font-size: 0.8rem; font-weight: 600;
            letter-spacing: 0.04em; padding: 0.25rem 0.4rem;
            transition: color 0.2s;
        }
        .toggle-pw:hover { color: rgba(255,255,255,0.8); }

        .field { margin-bottom: 1.25rem; }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #b30ce6 0%, #7c3aed 100%);
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            border-radius: 10px;
            padding: 0.875rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            margin-top: 0.5rem;
            letter-spacing: 0.03em;
        }
        .btn-submit:hover:not(:disabled) {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(179, 12, 230, 0.4);
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-submit .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle; margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #message {
            min-height: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 1rem;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            transition: all 0.2s;
        }
        #message:empty { padding: 0; }
        .msg-error   { background: rgba(239,68,68,0.12);  color: #f87171; }
        .msg-success { background: rgba(34,197,94,0.12);  color: #4ade80; }
        .msg-warn    { background: rgba(245,158,11,0.12); color: #fbbf24; }

        .footer-note {
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255,255,255,0.07);
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="../images2/favicon.png" alt="Omegatek">
            <h1>Admin Access</h1>
            <p>Omegatek Solutions Dashboard</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="emailInput">Email Address</label>
                <input type="email" id="emailInput" placeholder="you@example.com"
                       required autocomplete="email">
            </div>
            <div class="field">
                <label for="passwordInput">Password</label>
                <div class="pw-wrap">
                    <input type="password" id="passwordInput" placeholder="••••••••"
                           required autocomplete="current-password">
                    <button type="button" class="toggle-pw" id="togglePw" tabindex="-1">Show</button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                Access Dashboard
            </button>
        </form>

        <div id="message"></div>

        <div class="footer-note">
            🔒 Authorised personnel only &bull; Omegatek Solutions
        </div>
    </div>

    <script>
    (() => {
        // ── Supabase init ─────────────────────────────────────────────────────
        const SUPABASE_URL      = 'https://pefjkiijqratjixskmdx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZmpraWlqcXJhdGppeHNrbWR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0MzkwNDQsImV4cCI6MjA4ODAxNTA0NH0.x6s38k7avvoszJATabbUcp2zv9kjUVYRjKPT7n-pQJA';
        const { createClient }  = window.supabase;
        const _sb               = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { storageKey: 'sb-admin-auth-token' }
        });

        // ── DOM refs ──────────────────────────────────────────────────────────
        const $msg    = document.getElementById('message');
        const $btn    = document.getElementById('submitBtn');
        const $email  = document.getElementById('emailInput');
        const $pw     = document.getElementById('passwordInput');
        const $toggle = document.getElementById('togglePw');

        // ── Message helper ────────────────────────────────────────────────────
        function showMessage(text, type = 'error') {
            $msg.textContent  = text;
            $msg.className    = type === 'error'   ? 'msg-error'   :
                                type === 'success' ? 'msg-success' : 'msg-warn';
        }
        function clearMessage() { $msg.textContent = ''; $msg.className = ''; }

        // ── Button state ──────────────────────────────────────────────────────
        function setLoading(loading, label = 'Access Dashboard') {
            $btn.disabled    = loading;
            $btn.innerHTML   = loading
                ? '<span class="spinner"></span> Verifying…'
                : label;
        }

        // ── Password toggle ───────────────────────────────────────────────────
        $toggle.addEventListener('click', () => {
            const show      = $pw.type === 'password';
            $pw.type        = show ? 'text' : 'password';
            $toggle.textContent = show ? 'Hide' : 'Show';
        });

        // ── Client-side brute-force throttle (defence-in-depth only) ─────────
        // Real auth check is 100% server-side. This just adds friction.
        let fails     = parseInt(sessionStorage.getItem('adm_fails') || '0');
        let lockUntil = parseInt(sessionStorage.getItem('adm_lock')  || '0');
        const isLocked    = () => Date.now() < lockUntil;
        const recordFail  = () => {
            fails++;
            sessionStorage.setItem('adm_fails', fails);
            if (fails >= 5) {
                const until = Date.now() + 5 * 60 * 1000;
                sessionStorage.setItem('adm_lock', until);
                lockUntil = until;
            }
        };
        const resetFails  = () => {
            fails = 0;
            sessionStorage.removeItem('adm_fails');
            sessionStorage.removeItem('adm_lock');
        };

        // ── Auto-skip if already authorised session ───────────────────────────
        (async () => {
            const { data: { session } } = await _sb.auth.getSession();
            if (session) {
                // Silently verify server-side before redirect
                try {
                    const res = await fetch('verify-admin.php', {
                        method : 'POST',
                        headers: { 'Authorization': 'Bearer ' + session.access_token }
                    });
                    const json = await res.json();
                    if (json.success) {
                        window.location.replace('admin-dashboard.php');
                        return;
                    }
                } catch (_) { /* ignore */ }
                // Not authorised — sign out silently
                await _sb.auth.signOut();
            }
        })();

        // ── Reason messages from dashboard redirect ───────────────────────────
        const reason = new URLSearchParams(location.search).get('reason');
        if (reason === 'inactivity')       showMessage('⏱ Logged out due to 2 hours of inactivity.', 'warn');
        else if (reason === 'session_expired') showMessage('🔒 Session expired after 8 hours. Please log in again.', 'warn');
        else if (reason === 'backgrounded')    showMessage('⚠️ Logged out — tab was inactive for over 30 minutes.', 'warn');
        else if (reason === 'unauthorized')    showMessage('✗ Access denied. Authorised account only.', 'error');

        // ── Login form submit ─────────────────────────────────────────────────
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessage();

            if (isLocked()) {
                const secs = Math.ceil((lockUntil - Date.now()) / 1000);
                showMessage(`✗ Too many failed attempts. Try again in ${secs}s.`);
                return;
            }

            const email    = $email.value.trim().toLowerCase();
            const password = $pw.value;

            if (!email || !password) {
                showMessage('Please fill in all fields.');
                return;
            }

            setLoading(true);

            // Step 1: Authenticate with Supabase
            const { data, error } = await _sb.auth.signInWithPassword({ email, password });

            if (error) {
                recordFail();
                const msg = isLocked()
                    ? '✗ Too many failed attempts. Locked out for 5 minutes.'
                    : '✗ Invalid credentials. Please try again.';
                showMessage(msg);
                $pw.value = '';
                setLoading(false);
                return;
            }

            // Step 2: Server-side admin verification — email never in frontend
            try {
                const verifyRes = await fetch('verify-admin.php', {
                    method : 'POST',
                    headers: { 'Authorization': 'Bearer ' + data.session.access_token }
                });
                const verifyJson = await verifyRes.json();

                if (!verifyJson.success) {
                    // Authenticated but not an admin — sign out immediately
                    await _sb.auth.signOut();
                    recordFail();
                    showMessage('✗ Access denied.');
                    $pw.value = '';
                    setLoading(false);
                    return;
                }
            } catch (verifyErr) {
                await _sb.auth.signOut();
                showMessage('✗ Could not verify admin access. Please try again.');
                $pw.value = '';
                setLoading(false);
                return;
            }

            // Step 3: Authorised
            resetFails();
            sessionStorage.setItem('adm_login_at', Date.now().toString());
            showMessage('✓ Access granted! Redirecting…', 'success');
            setTimeout(() => { window.location.href = 'admin-dashboard.php'; }, 600);
        });

        $email.focus();
    })();
    </script>
</body>
</html>
